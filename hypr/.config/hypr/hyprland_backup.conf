########################################################################################
# CONFIGURACIÓN OPTIMIZADA: ESTÉTICA + BATERÍA
########################################################################################

env = XDG_RUNTIME_DIR,/run/user/1000
ecosystem:no_update_news = true

# AUTOSTART
exec-once = sleep 2 &&  waybar
exec-once = dunst
exec-once = swaybg -i /home/kr8zy/Downloads/ar8ch_1.png -m fill

# PROGRAMAS Y VARIABLES
$terminal = kitty
$fileManager = yazi
$menu = wofi --show drun

env = XCURSOR_SIZE,18
env = HYPRCURSOR_SIZE,18
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_THEME,Bibata-Modern-Classic
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

#################
### MONITORS ###
#################
monitor=,preferred,auto,1

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 3
    col.active_border = rgba(142,0,0,1) rgba(0,0,0,1) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 0.8  # Un poco más alto para facilitar la lectura

    # SOMBRAS: Desactivadas para ahorrar GPU
    shadow {
        enabled = false
    }

    # BLUR: Desactivado (es el proceso que más drena la batería)
    blur {
        enabled = false
    }
}

# ANIMACIONES: Más rápidas para que la GPU repose antes
animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 3, default
    animation = windows, 1, 3, easeOutQuint
    animation = windowsIn, 1, 3, easeOutQuint, popin 87%
    animation = windowsOut, 1, 2, quick, popin 87%
    animation = fadeIn, 1, 2, default
    animation = fadeOut, 1, 2, default
    animation = workspaces, 1, 2, default, fade

}

# MISC: Optimización de frames y batería
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true # Variable Frame Rate activado: IMPRESCINDIBLE
}

#############
### INPUT ###
#############

input {
    kb_layout = latam
    kb_options = caps:none, grp:shift_caps_switch
    follow_mouse = 1
    sensitivity = 0 
    touchpad {
        natural_scroll = true
    }
}

####################
### WINDOW RULES ###
####################

# Regla unificada para Kitty (Opacidad sin Blur)
windowrulev3 = opacity 0.85 0.75, class:^(kitty)$
windowrulev3 = opacity 0.85 0.75, title:^(.*zsh.*)$

# Reglas de capas para Wofi (Estética controlada)
layerrulev3 = dimaround, .*wofi.*
layerrulev3 = rounding 20, wofi

# Ignorar maximize requests
windowrulev3 = suppressevent maximize, class:.*

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, exec, firefox
bind = $mainMod, T, exec, thunar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, D, exec, discord
bind = $mainMod, S, exec, steam

# Navegación y Workspaces
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Multimedia y Brillo
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Screenshot region to clipboard
bind = SUPER_SHIFT, S, exec, grimblast --notify copy area

# Screenshot active window to clipboard
bind = SUPER_SHIFT, W, exec, grimblast --notify copy active

# Screenshot full screen to clipboard
bind = SUPER_SHIFT, Print, exec, grimblast --notify copy screen

# Ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
