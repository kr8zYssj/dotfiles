input {
    kb_layout = latam
    kb_options = caps:escape_shifted_capslock, grp:shift_caps_switch
    follow_mouse = 1
    sensitivity = 0 
    touchpad {
        natural_scroll = true
    }
}

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
